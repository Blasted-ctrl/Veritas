# Deployment template. Set the browser-visible API URL and allowed frontend
# origin before deploying. The API image includes the verified default model.
services:
  - type: web
    name: veritas-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: DOWNLOAD_PRETRAINED_MODEL
        value: "1"
      - key: VERITAS_REDIS_URL
        value: ""
      - key: VERITAS_ALLOWED_ORIGINS
        sync: false
  - type: web
    name: veritas-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_API_URL
        sync: false
